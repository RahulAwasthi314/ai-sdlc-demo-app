<header class="app-header">
  <mat-toolbar color="primary" class="toolbar">
    <div class="brand">
      <mat-icon class="brand-icon">receipt_long</mat-icon>
      <span class="app-title">Invoice Approvals</span>
    </div>

    @if (authService.isAuthenticated()) {
      <nav class="nav-links">
        @if (authService.userRole() === 'Employee') {
          <a mat-button routerLink="/invoices" routerLinkActive="active-link">My Invoices</a>
        }
        @if (authService.userRole() === 'Manager' || authService.userRole() === 'Approver') {
          <a mat-button routerLink="/approvals" routerLinkActive="active-link">Approvals</a>
        }
      </nav>

      <div class="user-meta">
        <span class="user-info">
          {{ authService.username() }}
          <span class="role-pill">{{ authService.userRole() }}</span>
        </span>
        <button mat-stroked-button (click)="onLogout()" class="logout-btn" aria-label="Sign out">
          Sign out
        </button>
      </div>
    }
  </mat-toolbar>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
